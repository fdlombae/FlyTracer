# FlyTracer Configuration File
# Command line arguments (--width, --height, --fullscreen, --no-vsync, ...) override these

# Window Settings
window_width=1280
window_height=720
window_title=FlyTracer
fullscreen=false
vsync=true

# Raytracing Settings
max_ray_bounces=3
# Raytraced pixels per window pixel along each side (0.25 to 1): lower is faster and blurrier
render_scale=1.0

# Resource Paths
resource_directory=resources
shader_directory=shaders
